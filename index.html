<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets 写入速度测试</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background: #f0f2f5;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    h1 { font-size: 22px; margin: 0 0 6px 0; }
    .sub { color: #888; font-size: 14px; margin-bottom: 20px; }
    button {
      padding: 16px 48px;
      font-size: 20px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #1a73e8;
      color: white;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 15px;
      background: #f8f9fa;
      min-height: 60px;
      line-height: 1.8;
      text-align: left;
      word-break: break-all;
    }
    .result.success { background: #e8f5e9; border-left: 4px solid #34a853; }
    .result.error { background: #ffebee; border-left: 4px solid #ea4335; }
    .result .big {
      font-size: 28px;
      font-weight: 700;
      color: #1a73e8;
    }
    .result .big.fast { color: #34a853; }
    .result .big.slow { color: #f9a825; }
    .result .big.very-slow { color: #ea4335; }
    .detail { font-size: 13px; color: #666; margin-top: 4px; }
    .info { margin-top: 16px; font-size: 12px; color: #aaa; }
    .history {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #888;
      text-align: left;
      max-height: 150px;
      overflow-y: auto;
    }
    .history .item {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .history .item .time { color: #aaa; }
    .history .item .speed { font-weight: 600; }
    .history .item .speed.fast { color: #34a853; }
    .history .item .speed.slow { color: #f9a825; }
    .history .item .speed.very-slow { color: #ea4335; }
  </style>
</head>
<body>

  <div class="card">
    <h1>✏️ Google Sheets 写入速度测试</h1>
    <p class="sub">Vercel → Google Sheets 实际写入耗时</p>

    <button id="btn" onclick="testWrite()">🚀 测试写入</button>

    <div class="result" id="result">点击按钮开始测试</div>
    <div class="info" id="info">等待测试...</div>

    <div class="history" id="history">
      <div style="color:#bbb;text-align:center;">暂无记录</div>
    </div>
  </div>

  <script>
    let historyData = [];

    async function testWrite() {
      const btn = document.getElementById('btn');
      const resultDiv = document.getElementById('result');
      const infoDiv = document.getElementById('info');

      btn.disabled = true;
      btn.textContent = '⏳ 写入中...';
      resultDiv.className = 'result';
      resultDiv.textContent = '⏳ 正在向 Google Sheets 写入数据...';

      const startTime = performance.now();

      try {
        const response = await fetch('/api/write-sheet', {
          cache: 'no-cache'
        });

        const data = await response.json();
        const endTime = performance.now();
        const frontendElapsed = ((endTime - startTime) / 1000).toFixed(2);

        // 显示结果
        const seconds = parseFloat(data.elapsedSeconds) || 0;
        let bigClass = 'fast';
        let speedDesc = '极快';
        if (seconds > 10) { bigClass = 'very-slow'; speedDesc = '很慢'; }
        else if (seconds > 5) { bigClass = 'slow'; speedDesc = '较慢'; }

        resultDiv.className = 'result success';
        resultDiv.innerHTML = `
          <div class="big ${bigClass}">${data.elapsedSeconds || '--'} 秒</div>
          <div>✅ Vercel → Google Sheets 写入成功</div>
          <div class="detail">⏱️ 后端耗时: ${data.elapsedMs || '--'} ms | 前端总耗时: ${frontendElapsed} s</div>
          <div class="detail">📡 HTTP: ${data.httpStatus || '--'}</div>
          <div class="detail">📄 写入行号: ${data.data?.row || '--'} | 写入内容: ${data.data?.name || '--'}</div>
        `;

        infoDiv.textContent = `测试时间: ${new Date().toLocaleString('zh-CN')} | 速度评级: ${speedDesc}`;

        // 记录历史
        historyData.push({
          time: new Date().toLocaleTimeString('zh-CN'),
          seconds: seconds,
          speedDesc: speedDesc,
          bigClass: bigClass,
          success: true
        });
        renderHistory();

      } catch (error) {
        const endTime = performance.now();
        const elapsed = ((endTime - startTime) / 1000).toFixed(2);

        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          <div>❌ 写入失败</div>
          <div class="detail">错误: ${error.message}</div>
          <div class="detail">⏱️ 耗时: ${elapsed} 秒</div>
        `;
        infoDiv.textContent = `测试时间: ${new Date().toLocaleString('zh-CN')} | 请检查网络或 API 配置`;

        historyData.push({
          time: new Date().toLocaleTimeString('zh-CN'),
          seconds: elapsed,
          speedDesc: '失败',
          bigClass: 'very-slow',
          success: false
        });
        renderHistory();
      }

      btn.disabled = false;
      btn.textContent = '🚀 再次测试';
    }

    function renderHistory() {
      const historyDiv = document.getElementById('history');
      if (historyData.length === 0) {
        historyDiv.innerHTML = '<div style="color:#bbb;text-align:center;">暂无记录</div>';
        return;
      }
      let html = '';
      const show = historyData.slice(-10).reverse();
      for (const h of show) {
        const status = h.success ? '✅' : '❌';
        const speedClass = h.bigClass || 'fast';
        html += `<div class="item">
          <span>${status} ${h.time}</span>
          <span class="speed ${speedClass}">${h.success ? h.seconds + 's' : h.speedDesc}</span>
        </div>`;
      }
      historyDiv.innerHTML = html;
    }
  </script>
</body>
</html>
